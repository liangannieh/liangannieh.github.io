<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>哲学分院帽</title>
    <meta
      name="description"
      content="一个自适应的哲学测验，提供概念、日常、视觉与混合四条提问路线。"
    >
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='6' fill='%2320211e'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='26' font-family='sans-serif' font-weight='700' fill='%23fffdf8'%3E%E5%93%B2%3C/text%3E%3C/svg%3E"
    >
    <link rel="preload" href="../philosophysortinghat/assets/philosophy-light.png" as="image">
    <link rel="stylesheet" href="../philosophysortinghat/styles.css?v=20260815-2">
    <link rel="stylesheet" href="lang.css?v=20260815-1">
  </head>
  <body>
    <main class="app-shell">
      <section class="quiz-pane" aria-labelledby="app-title">
        <header class="app-header">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">哲学</div>
            <div>
              <p class="eyebrow">哲学分院帽</p>
              <h1 id="app-title">哪一种哲学最适合你？</h1>
            </div>
          </div>
          <div class="question-count" id="question-count" aria-live="polite"></div>
        </header>

        <section class="route-view" id="route-view" aria-labelledby="route-title">
          <p class="route-kicker">选择你的入口</p>
          <h2 id="route-title">哪一类问题你最容易回答？</h2>
          <p class="route-intro">
            可以从日常处境、绘画、直接的哲学观念开始，或是几者兼有。
          </p>

          <div class="route-grid" id="route-grid">
            <button type="button" class="route-card" data-route="meta">
              <span class="route-card-topline"><span>重大观念</span></span>
              <strong>从第一原理出发思考</strong>
              <span>意义、知识、道德、实在与自我——直截了当地提出。</span>
              <em>「好的生活最接近于…」</em>
            </button>
            <button type="button" class="route-card" data-route="scenario">
              <span class="route-card-topline"><span>日常抉择</span></span>
              <strong>从寻常生活开始</strong>
              <span>室友、杂事、群聊、泡汤的计划、尴尬的人情，以及一个个小决定。</span>
              <em>「你的计划泡汤了。这个下午你会怎么过？」</em>
            </button>
            <button type="button" class="route-card" data-route="visual">
              <span class="route-card-topline"><span>透过艺术</span></span>
              <strong>在细看中思考</strong>
              <span>那些开启价值、真理与人生之问的绘画与场景。</span>
              <em>「这幅图像里，什么显得最重要？」</em>
            </button>
            <button type="button" class="route-card featured" data-route="mixed">
              <span class="route-card-topline"><span>各样都来一点</span><span class="route-badge">推荐</span></span>
              <strong>在三种形式之间穿行</strong>
              <span>一条穿过直接观念、日常处境与艺术的多样路径。</span>
              <em>如果你对每一道门都好奇，这条最合适。</em>
            </button>
          </div>

          <div class="route-actions is-hidden" id="route-actions">
            <button type="button" class="button secondary" id="cancel-route-button">回到测验</button>
          </div>
        </section>

        <section class="quiz-view is-hidden" id="quiz-view" aria-labelledby="question-title">
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>

          <form id="quiz-form" class="quiz-form">
            <fieldset class="question-field">
              <div class="question-meta">
                <span id="question-mode"></span>
              </div>
              <legend id="question-title" tabindex="-1"></legend>
              <p id="question-copy" class="question-copy"></p>
              <div id="question-media"></div>
              <div id="options-list" class="options-list"></div>
            </fieldset>

            <div class="actions">
              <button type="button" class="button secondary" id="back-button">上一题</button>
              <button type="submit" class="button primary" id="next-button">下一题</button>
            </div>
          </form>
        </section>

        <section class="result-view is-hidden" id="result-view" aria-live="polite">
          <div class="result-kicker">你的结果</div>
          <h2 id="result-title"></h2>
          <p id="result-summary" class="result-summary"></p>
          <div id="result-description" class="result-description"></div>

          <div class="result-meta">
            <div>
              <h3>次要影响</h3>
              <p id="secondary-result"></p>
            </div>
            <div>
              <h3>相近的思想家</h3>
              <p id="result-thinkers"></p>
            </div>
          </div>

          <div class="thinking-style-block">
            <h3>你进入这些问题的方式</h3>
            <p class="thinking-style-title" id="thinking-style-title"></p>
            <p id="thinking-style-description"></p>
          </div>

          <div class="affinity-block">
            <h3>最高的契合度</h3>
            <p class="section-note" id="affinity-note">
              这些是相对的契合分数，不是概率。你最强的一项被设为 100，其余各项显示它们与这个最高分的接近程度。
            </p>
            <div id="affinity-list" class="affinity-list"></div>
          </div>

          <div class="reading-block">
            <h3>建议的入门读物</h3>
            <p class="section-note">
              一份简短的阅读路径：书名、作者或出处，以及它为什么与这个结果相配。
            </p>
            <div id="reading-list" class="reading-list"></div>
          </div>

          <div class="actions result-actions">
            <button type="button" class="button secondary" id="retake-button">重做这条路线</button>
            <button type="button" class="button secondary" id="another-route-button">试试别的路线</button>
            <button type="button" class="button primary" id="copy-button">分享这个结果</button>
          </div>
          <p class="copy-status" id="copy-status" role="status"></p>

          <div class="category-link-row">
            <button type="button" class="text-link" id="view-categories-button" aria-controls="category-directory" aria-expanded="false">
              查看所有哲学门类
            </button>
          </div>

          <section class="category-directory is-hidden" id="category-directory" aria-labelledby="category-directory-title">
            <h3 id="category-directory-title">全部类别</h3>
            <div id="category-list" class="category-list"></div>
          </section>
        </section>
      </section>

      <aside class="visual-pane" aria-label="极简的哲学构图">
        <img
          src="../philosophysortinghat/assets/philosophy-light.png"
          alt="一幅明亮的极简纸面构图：淡淡的晕染、一道细弧、一条赭红色的线，以及两个黄铜色圆点。"
        >
      </aside>
    </main>

    <script src="scenario-variants.js?v=20260815-8"></script>
    <script src="visual-variants.js?v=20260815-7"></script>
    <script src="script.js?v=20260815-7"></script>
  </body>
</html>
